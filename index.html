<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0e17">
<title>弹幕靶场 · Toy 原型</title>
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div class="hud-row">
      <div class="hud-col">
        <div class="score" id="score">0</div>
        <div class="sub" id="combo">连击 x1</div>
      </div>
      <div class="hud-col right">
        <div class="meter-label">糊屏 <b id="dirtyPct">0%</b></div>
        <div class="meter dirty"><i id="dirtyFill"></i></div>
        <div class="meter-label">反弹 <b id="energyPct">0%</b></div>
        <div class="meter energy"><i id="energyFill"></i></div>
      </div>
    </div>
  </div>

  <button id="ultBtn" class="hidden" aria-label="反弹">反弹</button>

  <div id="startScreen" class="overlay">
    <div class="card">
      <div class="logo">弹幕靶场</div>
      <p class="tag">你的评论区，就是我的靶场。</p>
      <ul class="rules">
        <li>拖动屏幕左右走位，<b>枪自动开火</b></li>
        <li>打碎落下的弹幕，别让它们落地</li>
        <li>漏掉的弹幕会<b>糊在屏幕上</b>，糊满 100% 就被淹没</li>
        <li>攒满能量按「反弹」，把弹幕原路打回</li>
      </ul>
      <button id="startBtn" class="primary">开始</button>
      <p class="hint">Toy 平台内测作品原型 · 手机竖屏单手可玩</p>
    </div>
  </div>

  <div id="overScreen" class="overlay hidden">
    <div class="card">
      <div class="over-title" id="overTitle">你被评论区淹没了</div>
      <div class="death" id="deathText">你死于「就这？」</div>
      <div class="stats">
        <div><b id="stScore">0</b><span>得分</span></div>
        <div><b id="stKill">0</b><span>击碎弹幕</span></div>
        <div><b id="stCombo">0</b><span>最高连击</span></div>
        <div><b id="stTime">0:00</b><span>存活时间</span></div>
      </div>
      <button id="againBtn" class="primary">再来一局</button>
      <button id="saveBtn" class="ghost">生成战绩图</button>
      <a id="dlLink" class="hidden" download="弹幕靶场-战绩.png">点此保存战绩图</a>
    </div>
  </div>
</div>
<script type="module" src="./js/game.js"></script>
</body>
</html>
